[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l-response-package-skill"
version = "0.1.0"
description = "Two-to-four L missile hidden-target response package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "skill-generation==0.1.0",
  "target-damage-belief-skill==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
