[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-missile-joint-skill"
version = "0.1.0"
description = "Sparse three-missile coordination layered over V13"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "skill-generation==0.1.0",
  "turn-left-skill==0.1.0",
  "turn-right-skill==0.1.0",
  "stop-turning-skill==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
