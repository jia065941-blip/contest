[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-upper-orchestrator-skill"
version = "2.2.0"
description = "Official-release adapter for the simple staggered H/M/L upper layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "skill-generation==0.1.0",
  "staggered-deployment-skill==0.8.0",
  "l-satellite-strike-packages-skill==0.2.0",
  "hm-public-strike-packages-skill==0.9.0",
  "target-damage-probability-skill==0.3.0",
  "dynamic-retarget-skill==0.3.0",
  "local-avoidance-skill==0.1.0",
  "terminal-guidance-override-skill==0.3.0",
  "reserve-echelon-skill==0.2.0",
  "reserve-holding-maneuver-skill==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
simple-upper-release = "simple_upper_orchestrator_skill.release_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
