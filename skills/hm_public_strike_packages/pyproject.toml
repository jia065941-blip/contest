[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-public-strike-packages-skill"
version = "0.1.0"
description = "Deterministic H/M strike packages for public targets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["skill-generation==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
