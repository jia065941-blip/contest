[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-generation"
version = "0.1.0"
description = "Explicit, validated numerical inference sessions"
readme = "README.md"
requires-python = ">=3.11"
# Framework range; each model bundle can require an exact validated version.
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
skill-generation = "skill_generation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
